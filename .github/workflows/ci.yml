name: Rust and Python
on: [push, pull_request, workflow_dispatch]
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: cargo fmt --all --check
      - run: cargo test --release --workspace --locked -- --test-threads=1
      - run: cargo build --release --workspace --locked
      - run: cargo check --workspace --no-default-features --locked
      - run: python -m pip install ./python
      - run: python -m unittest discover -s python/tests
      - uses: actions/upload-artifact@v4
        with:
          name: rustdock-vina-${{ matrix.os }}
          path: |
            target/release/vina
            target/release/vina.exe
            target/release/vina-benchmark
            target/release/vina-benchmark.exe
            target/release/vina_split
            target/release/vina_split.exe
            target/release/rustdock-vina-server
            target/release/rustdock-vina-server.exe
